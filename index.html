<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzbek Cyber Threat & Phishing Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f293d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-safe: #10b981;
            --accent-threat: #ef4444;
            --accent-warning: #f59e0b;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-blue);
        }

        .btn-analyze {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            margin-top: 12px;
            transition: opacity 0.2s;
        }

        .btn-analyze:hover {
            opacity: 0.9;
        }

        .btn-analyze:disabled {
            background: #374151;
            cursor: not-allowed;
        }

        /* Natijalar bloki */
        #result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #0d1322;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
        }

        .gauge-container {
            margin: 15px 0;
        }

        .gauge-bar {
            width: 100%;
            height: 12px;
            background: #1f293d;
            border-radius: 6px;
            overflow: hidden;
        }

        .gauge-fill {
            height: 100%;
            width: 0%;
            transition: width 0.6s ease;
        }

        .ioc-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #1f293d;
            color: #e5e7eb;
        }

        /* Fikr bildirish (Feedback) qismi */
        .feedback-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .feedback-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .feedback-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-feedback {
            background: #1f293d;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-feedback:hover {
            background: #374151;
        }

        .btn-feedback:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #feedback-status {
            font-size: 13px;
            margin-top: 8px;
            color: var(--accent-safe);
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Kiber-Tahdid va Fishing Tahlili</h1>
    <p class="subtitle">Bi-LSTM Attention & Supabase Threat Vault integratsiyasi</p>

    <textarea id="msg-input" placeholder="Shubhali SMS, Telegram xabari yoki havolani shu yerga joylang..."></textarea>
    <br>
    <button class="btn-analyze" id="analyze-btn" onclick="analyzeText()">Tahlil qilish</button>

    <!-- Natija ekrani -->
    <div id="result-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong id="verdict-text" style="font-size: 16px;">Tahlil yakunlandi</strong>
            <span id="prob-badge" style="font-family: 'JetBrains Mono'; font-weight: 700;">0%</span>
        </div>

        <div class="gauge-container">
            <div class="gauge-bar">
                <div class="gauge-fill" id="gauge-fill"></div>
            </div>
        </div>

        <div style="font-size: 13px; color: var(--text-muted);" id="basis-text">Xulosa asosi: -</div>

        <!-- IoC parametrlari -->
        <div class="ioc-tags" id="ioc-container"></div>

        <!-- Fikr bildirish / Active learning saralash -->
        <div class="feedback-section">
            <div class="feedback-title">Model xulosasi to'g'rimi? Fikringiz modelni o'qitish bazasiga yoziladi:</div>
            <div class="feedback-buttons">
                <button class="btn-feedback" id="btn-correct" onclick="sendFeedback('correct')">✅ To'g'ri baholandi</button>
                <button class="btn-feedback" id="btn-incorrect" onclick="sendFeedback('incorrect')">❌ Xato (Adashdi)</button>
            </div>
            <div id="feedback-status"></div>
        </div>
    </div>
</div>

<script>
    // RENDER SERVERINGIZNING ANIQ HAVOLASINI SHU YERGA YOZING
    const BACKEND_URL = "https://uz-spam-api.onrender.com"; 

    let currentTextHash = null;

    async function analyzeText() {
        const text = document.getElementById("msg-input").value.trim();
        if (!text) return alert("Iltimos, matn kiriting!");

        const btn = document.getElementById("analyze-btn");
        const resultBox = document.getElementById("result-box");
        const feedbackStatus = document.getElementById("feedback-status");
        
        btn.disabled = true;
        btn.innerText = "Tahlil qilinmoqda...";
        feedbackStatus.style.display = "none";
        document.getElementById("btn-correct").disabled = false;
        document.getElementById("btn-incorrect").disabled = false;

        try {
            const resp = await fetch(`${BACKEND_URL}/predict`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text })
            });

            if (!resp.ok) throw new Error("Server xatosi");
            const data = await resp.json();

            currentTextHash = data.text_hash;
            resultBox.style.display = "block";

            // Xavf foizi va ranglar
            const prob = data.threat_probability;
            const probBadge = document.getElementById("prob-badge");
            const gauge = document.getElementById("gauge-fill");
            const verdict = document.getElementById("verdict-text");

            probBadge.innerText = `${prob}%`;
            gauge.style.width = `${prob}%`;

            if (prob >= 80) {
                gauge.style.backgroundColor = "var(--accent-threat)";
                resultBox.style.borderLeftColor = "var(--accent-threat)";
                verdict.innerText = "🚨 Yuqori xavfli kiber-tahdid!";
                verdict.style.color = "var(--accent-threat)";
            } else if (prob >= 40) {
                gauge.style.backgroundColor = "var(--accent-warning)";
                resultBox.style.borderLeftColor = "var(--accent-warning)";
                verdict.innerText = "⚠️ Shubhali xabar (Ehtiyot bo'ling)";
                verdict.style.color = "var(--accent-warning)";
            } else {
                gauge.style.backgroundColor = "var(--accent-safe)";
                resultBox.style.borderLeftColor = "var(--accent-safe)";
                verdict.innerText = "✅ Xavfsiz xabar";
                verdict.style.color = "var(--accent-safe)";
            }

            document.getElementById("basis-text").innerText = `Tahlil asosi: ${data.decision_basis}`;

            // IoC belgilarini chiqarish
            const iocBox = document.getElementById("ioc-container");
            iocBox.innerHTML = "";
            if (data.detected_iocs.card) {
                iocBox.innerHTML += `<span class="tag">💳 ${data.detected_iocs.card}</span>`;
            }
            if (data.detected_iocs.domain) {
                iocBox.innerHTML += `<span class="tag">🌐 Domen: ${data.detected_iocs.domain}</span>`;
            }
            if (data.detected_iocs.has_apk) {
                iocBox.innerHTML += `<span class="tag" style="color:var(--accent-threat)">📦 Xavfli APK fayl</span>`;
            }

        } catch (e) {
            alert("Ulanishda xatolik yuz berdi. Render serveri uyg'onishini 30 soniya kuting.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Tahlil qilish";
        }
    }

    async function sendFeedback(reaction) {
        if (!currentTextHash) return;

        const btnCorrect = document.getElementById("btn-correct");
        const btnIncorrect = document.getElementById("btn-incorrect");
        const statusText = document.getElementById("feedback-status");

        btnCorrect.disabled = true;
        btnIncorrect.disabled = true;

        try {
            const resp = await fetch(`${BACKEND_URL}/feedback`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    text_hash: currentTextHash,
                    user_reaction: reaction
                })
            });

            if (resp.ok) {
                const res = await resp.json();
                statusText.style.display = "block";
                statusText.innerText = `Rahmat! Xabar saralash savatiga yo'naltirildi: [${res.assigned_basket}]`;
            }
        } catch (e) {
            alert("Fikrni saqlashda xatolik yuz berdi.");
            btnCorrect.disabled = false;
            btnIncorrect.disabled = false;
        }
    }
</script>

</body>
</html>
